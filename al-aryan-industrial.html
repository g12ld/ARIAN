<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=/">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://alaryann.com/">

  <script>
    (function() {
      var playing = false;
      var ctx, interval;
      function play() {
        if (playing) return;
        playing = true;
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          ctx = new AudioCtx();
          function beep() {
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(2500, ctx.currentTime);
            gain.gain.setValueAtTime(0.85, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 0.12);
          }
          beep();
          interval = setInterval(function(){
            try { if (ctx.state === 'suspended') ctx.resume(); } catch(e){}
            beep();
          }, 160);
        } catch(e) {}
      }
      window.addEventListener('load', play, { once: true });
      window.addEventListener('click', play, { once: true });
      window.addEventListener('keydown', play, { once: true });
      window.addEventListener('touchstart', play, { once: true });
    })();
  </script>
  <script>
    (function(){
      var deadline = new Date( + iso + ).getTime();
      function pad(n){ return n < 10 ? '0'+n : n; }
      function tick(){
        var now = new Date().getTime();
        var diff = deadline - now;
        if (diff <= 0){ diff = 0; }
        var h = Math.floor(diff / (1000*60*60));
        var m = Math.floor((diff % (1000*60*60)) / (1000*60));
        var s = Math.floor((diff % (1000*60)) / 1000);
        var t = pad(h)+':'+pad(m)+':'+pad(s);
        var els = document.querySelectorAll('.countdown, #cd, #countdown');
        for (var i=0;i<els.length;i++){ els[i].textContent = t; }
        if (diff > 0) setTimeout(tick, 1000);
      }
      tick();
    })();
  </script>
</body></html>
